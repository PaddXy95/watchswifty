name: CI/CD

# Pull requests: tests and a test build of the image (nothing is pushed).
# Push to main: tests and image build in parallel → (only if the tests are green) push to GHCR → GitHub release.
# Push to beta, or "Run workflow" on any branch: same, but only the :beta and :beta-<commit> tags are pushed
# (no git tag, no GitHub release, :latest stays untouched).
# The release/beta jobs rebuild from the image job's cache, so they only push.
on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:

# Releases on main run one after another, so each run sees the tags of the previous one.
# A newer beta push supersedes an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/beta' }}

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7
      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Test
        run: swift test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (cache only)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create tag + release
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags are needed to compute the next version

      - name: Next version
        id: version
        run: |
          version=$(bash scripts/next-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/watchswifty" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:latest
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.minor }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha   # filled by the image job; this build only pushes

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          bash scripts/release-notes.sh "$VERSION" > notes.md
          printf '\n\nDocker: `%s:%s`\n' "$IMAGE" "$VERSION" >> notes.md
          if grep -q '[^[:space:]]' <(bash scripts/release-notes.sh "$VERSION"); then
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "WatchSwifty $VERSION" --notes-file notes.md
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "WatchSwifty $VERSION" --generate-notes
          fi

  beta:
    needs: [test, image]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/beta') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags are needed to compute the next version

      - name: Beta version
        id: version
        run: |
          # "0.3.1-beta" is no X.Y.Z release, so the app labels it "0.3.1-beta (abc1234)" and the update check
          # does not offer a downgrade to the last release.
          version="$(bash scripts/next-version.sh)-beta"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/watchswifty" >> "$GITHUB_OUTPUT"
          echo "Beta $version (${GITHUB_SHA::7}) from $GITHUB_REF_NAME"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push beta image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:beta
            ${{ steps.version.outputs.image }}:beta-${{ steps.version.outputs.commit }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha   # filled by the image job; this build only pushes
