# WatchSwifty on a server in your home network.
# Put a `.env` next to this file (template: `.env.example`). Start: `docker compose up -d`.
services:
  watchswifty:
    image: ghcr.io/paddxy95/watchswifty:${WATCHSWIFTY_VERSION:-latest}
    container_name: watchswifty
    restart: unless-stopped
    ports:
      - "${WATCHSWIFTY_PORT:-8080}:8080"
    environment:
      # Key for the stored TMDB tokens and other secrets – keep it separate from the data.
      TOKEN_KEY: ${TOKEN_KEY:?TOKEN_KEY is missing in .env (openssl rand -base64 32)}
      # Only needed on the very first start: creates the first admin.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TZ: ${TZ:-Europe/Berlin}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-de-DE}
      # Only needed behind a reverse proxy, for example https://watch.example.lan
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      # SSO is set up under System. Emergency switch (forces password login): PASSWORD_LOGIN=true in .env
      # PASSWORD_LOGIN: ${PASSWORD_LOGIN:-}
    volumes:
      - watchswifty-data:/data
      # Optional – mail through SwiftyRelay (docs/email.md): mount the relay's CA read-only.
      # - swifty-relay-certs:/certs/swifty-relay:ro
    # Optional – mail through SwiftyRelay: join the relay's Docker network (SwiftyRelay must have been started once).
    # networks: [default, swifty-relay]

volumes:
  watchswifty-data:
    # Fixed name, so `docker run -v watchswifty-data:/data …` (backup, docs/operations.md) hits the same volume.
    name: watchswifty-data
  # Optional – mail through SwiftyRelay:
  # swifty-relay-certs:
  #   external: true

# Optional – mail through SwiftyRelay:
# networks:
#   swifty-relay:
#     external: true
