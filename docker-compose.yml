# watchswifty – Beispiel für den Betrieb auf einem Server im Heimnetz.
# Image wird von der GitHub Action aus github.com/PaddXy95/watchswifty gebaut.
services:
  watchswifty:
    image: ghcr.io/paddxy95/watchswifty:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TMDB_LANGUAGE: de-DE
      # Nur beim allerersten Start nötig: legt den ersten Admin an.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TZ: Europe/Berlin
      # Schlüssel für die gespeicherten TMDB-Tokens (openssl rand -base64 32). Leer = token.key im Volume.
      TOKEN_KEY: ${TOKEN_KEY:-}
    volumes:
      - watchswifty-data:/data

volumes:
  watchswifty-data:
    # Fixed name, so `docker run -v watchswifty-data:/data …` (README backup) uses the same volume.
    name: watchswifty-data
