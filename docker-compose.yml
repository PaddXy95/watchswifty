# WatchSwifty auf einem Server im Heimnetz.
# Neben diese Datei gehört eine `.env` (Vorlage: `.env.example`). Start: `docker compose up -d`.
services:
  watchswifty:
    image: ghcr.io/paddxy95/watchswifty:${WATCHSWIFTY_VERSION:-latest}
    container_name: watchswifty
    restart: unless-stopped
    ports:
      - "${WATCHSWIFTY_PORT:-8080}:8080"
    environment:
      # Schlüssel für die gespeicherten TMDB-Tokens – getrennt von den Daten aufbewahren.
      TOKEN_KEY: ${TOKEN_KEY:?TOKEN_KEY fehlt in .env (openssl rand -base64 32)}
      # Nur beim allerersten Start nötig: legt den ersten Admin an.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TZ: ${TZ:-Europe/Berlin}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-de-DE}
      # Nur hinter einem Reverse-Proxy nötig, z. B. https://watch.example.lan
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      # SSO wird unter System eingerichtet. Notschalter (erzwingt den Passwort-Login): PASSWORD_LOGIN=true in der .env
      # PASSWORD_LOGIN: ${PASSWORD_LOGIN:-}
    volumes:
      - watchswifty-data:/data
      # Optional – Mail über SwiftyRelay (README, „E-Mail (optional)“): CA des Relays read-only einbinden.
      # - swifty-relay-certs:/certs/swifty-relay:ro
    # Optional – Mail über SwiftyRelay: ins Docker-Netz des Relays (SwiftyRelay muss vorher einmal gestartet sein).
    # networks: [default, swifty-relay]

volumes:
  watchswifty-data:
    # Fester Name, damit `docker run -v watchswifty-data:/data …` (Backup im README) dasselbe Volume trifft.
    name: watchswifty-data
  # Optional – Mail über SwiftyRelay:
  # swifty-relay-certs:
  #   external: true

# Optional – Mail über SwiftyRelay:
# networks:
#   swifty-relay:
#     external: true
