openapi: 3.1.0
info:
  title: WatchSwifty API
  version: 1.0.0
  description: |
    JSON-API für die WatchSwifty-App. Anmeldung über das Browser-Fenster (Authorization Code + PKCE),
    danach mit Geräte-Token im Header `Authorization: Bearer ws_…` (90 Tage gültig).
servers:
  - url: /api
tags:
  - name: Meta
  - name: Konto
  - name: Start
  - name: Suche
  - name: Serien
  - name: Filme
  - name: Verlauf
  - name: Bibliothek
  - name: Statistik
  - name: Netflix-Import
  - name: Filmliste
  - name: Admin
paths:
  /v1/version:
    get:
      operationId: getVersion
      tags: [Meta]
      summary: Version des Servers
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /v1/auth/token:
    post:
      operationId: createToken
      tags: [Konto]
      summary: Einmal-Code aus dem Browser-Login gegen ein Geräte-Token tauschen
      description: |
        Ablauf: Die App öffnet `/api/auth/authorize?redirect_uri=watchswifty://auth&state=…&code_challenge=…&code_challenge_method=S256&device_name=…`
        im System-Browser-Fenster. Nach Anmeldung und „Verbinden“ springt der Browser zu `watchswifty://auth?code=…&state=…`.
        Den Code (60 s gültig, einmal einlösbar) hier mit dem PKCE-`codeVerifier` einlösen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Geräte-Token (wird nur hier einmal ausgegeben)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenGrant"
        "400":
          description: Code ungültig, abgelaufen oder Verifier falsch (`invalidGrant`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: revokeCurrentToken
      tags: [Konto]
      summary: Dieses Gerät abmelden
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Token widerrufen
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me:
    get:
      operationId: getMe
      tags: [Konto]
      summary: Angemeldeter Benutzer
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Benutzer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me/devices:
    get:
      operationId: listDevices
      tags: [Konto]
      summary: Geräte und manuell erstellte Tokens
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Geräte (ohne Token-Werte)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me/devices/{id}:
    delete:
      operationId: revokeDevice
      tags: [Konto]
      summary: Gerät abmelden
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Abgemeldet
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tv/{tmdbID}:
    get:
      operationId: getSeries
      tags: [Serien]
      summary: Serie mit Staffeln, Folgen und eigenen Sichtungen
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      responses:
        "200":
          description: Serie mit Staffeln und Folgen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/episodes/{season}/{number}/watch:
    post:
      operationId: markEpisode
      tags: [Serien]
      summary: Folge als gesehen markieren
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
        - $ref: "#/components/parameters/Season"
        - $ref: "#/components/parameters/Episode"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchInput"
      responses:
        "200":
          description: Serie mit Staffeln und Folgen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: unmarkEpisode
      tags: [Serien]
      summary: Folge als ungesehen markieren (alle Sichtungen)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
        - $ref: "#/components/parameters/Season"
        - $ref: "#/components/parameters/Episode"
      responses:
        "200":
          description: Serie mit Staffeln und Folgen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/episodes/{season}/{number}/watch-up-to:
    post:
      operationId: markUpTo
      tags: [Serien]
      summary: Alle Folgen bis hier gesehen (ohne Datum)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
        - $ref: "#/components/parameters/Season"
        - $ref: "#/components/parameters/Episode"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchInput"
      responses:
        "200":
          description: Serie mit Staffeln und Folgen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/seasons/{season}/watch:
    post:
      operationId: markSeason
      tags: [Serien]
      summary: Ganze Staffel gesehen (ohne Datum)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
        - $ref: "#/components/parameters/Season"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchInput"
      responses:
        "200":
          description: Serie mit Staffeln und Folgen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/watch-all:
    post:
      operationId: markSeries
      tags: [Serien]
      summary: Gesamte Serie gesehen (ohne Datum)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchInput"
      responses:
        "200":
          description: Serie mit Staffeln und Folgen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/hidden:
    put:
      operationId: setHidden
      tags: [Serien]
      summary: Serie aus- oder einblenden
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HiddenInput"
      responses:
        "200":
          description: Serie mit Staffeln und Folgen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/follow:
    put:
      operationId: setFollowed
      tags: [Serien]
      summary: Serie beobachten (Hinweis auf neue Folgen)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowInput"
      responses:
        "200":
          description: Serie mit Staffeln und Folgen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/rating:
    put:
      operationId: setSeriesRating
      tags: [Serien]
      summary: Bewertung 1–10 setzen; ohne `rating` löschen
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingInput"
      responses:
        "200":
          description: Serie mit Staffeln und Folgen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/comment:
    put:
      operationId: setSeriesComment
      tags: [Serien]
      summary: Kommentar zur Serie; ohne `comment` löschen
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "200":
          description: Serie mit Staffeln und Folgen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/seasons/{season}/comment:
    put:
      operationId: setSeasonComment
      tags: [Serien]
      summary: Kommentar zur Staffel
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
        - $ref: "#/components/parameters/Season"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "200":
          description: Serie mit Staffeln und Folgen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/continue-watching:
    get:
      operationId: getContinueWatching
      tags: [Start]
      summary: Weiterschauen (Serien der letzten 3 Monate; mit `all=true` alle)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: all
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Karten
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinueWatching"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/notes:
    get:
      operationId: getNotes
      tags: [Start]
      summary: Neue Folgen beobachteter Serien und Folgen der nächsten 14 Tage
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Hinweise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notes"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/tv/{tmdbID}/next:
    post:
      operationId: markNextEpisode
      tags: [Start]
      summary: Nächste Folge der Karte gesehen (heute, zuletzt genutzter Dienst)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NextInput"
      responses:
        "200":
          description: Aktualisierte Karte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinueCard"
        "204":
          description: Serie ist aufgeholt (keine Karte mehr)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/new-episodes/dismiss:
    post:
      operationId: dismissNewEpisodes
      tags: [Start]
      summary: Hinweis „Neue Folgen“ erledigen
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      responses:
        "204":
          description: Erledigt
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/search:
    get:
      operationId: search
      tags: [Suche]
      summary: Serien und Filme bei TMDB suchen (mindestens 2 Zeichen)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Treffer mit eigenem Stand
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchHit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/movies/{tmdbID}:
    get:
      operationId: getMovie
      tags: [Filme]
      summary: Film mit eigenen Sichtungen
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      responses:
        "200":
          description: Film mit eigenen Sichtungen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/movies/{tmdbID}/watch:
    post:
      operationId: markMovie
      tags: [Filme]
      summary: Film gesehen (mit `rewatch` erneut gesehen)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchInput"
      responses:
        "200":
          description: Film mit eigenen Sichtungen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: unmarkMovie
      tags: [Filme]
      summary: Alle Sichtungen des Films löschen
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      responses:
        "200":
          description: Film mit eigenen Sichtungen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/movies/{tmdbID}/rating:
    put:
      operationId: setMovieRating
      tags: [Filme]
      summary: Bewertung 1–10; ohne `rating` löschen
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingInput"
      responses:
        "200":
          description: Film mit eigenen Sichtungen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/movies/{tmdbID}/comment:
    put:
      operationId: setMovieComment
      tags: [Filme]
      summary: Kommentar zum Film; ohne `comment` löschen
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "200":
          description: Film mit eigenen Sichtungen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/history:
    get:
      operationId: getHistory
      tags: [Verlauf]
      summary: Datierte Sichtungen, neueste zuerst
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: perPage
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: Eine Seite des Verlaufs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/watches/{id}:
    put:
      operationId: updateWatch
      tags: [Verlauf]
      summary: Datum und Dienst einer Sichtung ändern (ersetzt beide)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchEdit"
      responses:
        "200":
          description: Geänderte Sichtung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteWatch
      tags: [Verlauf]
      summary: Sichtung löschen
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Gelöscht
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/library:
    get:
      operationId: getLibrary
      tags: [Bibliothek]
      summary: Gesehene, bewertete oder ausgeblendete Titel
      security: [{ bearerAuth: [] }]
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, tv, movie, hidden]
            default: all
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent, rating, name]
            default: recent
      responses:
        "200":
          description: Titel
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/stats:
    get:
      operationId: getStats
      tags: [Statistik]
      summary: Filme, Serien, Folgen und Zeit – Zeitraum mit Diagramm, Diensten, Meistgesehen und Bewertungen
      description: >-
        `year` wählt den Zeitraum für `period`, `previous`, `chart`, `services`, `topSeries` und `ratings`.
        `total`, `undated` und `years` umfassen immer alles.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: year
          in: query
          description: Zeitraum auf ein Jahr eingrenzen (fehlt = alle Jahre).
          schema:
            type: integer
      responses:
        "200":
          description: Statistik
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me/password:
    put:
      operationId: changePassword
      tags: [Konto]
      summary: Passwort ändern (aktuelles Passwort nötig)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Geändert
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Konto ohne Passwort (`noPassword`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/me/email:
    put:
      operationId: setEmail
      tags: [Konto]
      summary: Eigene E-Mail-Adresse setzen oder mit leerem Wert entfernen (aktuelles Passwort nötig, wird verschlüsselt gespeichert)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChange"
      responses:
        "200":
          description: Gespeichert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Konto ohne Passwort (`noPassword`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/me/tmdb-token:
    put:
      operationId: setTMDBToken
      tags: [Konto]
      summary: Eigenen TMDB-Token hinterlegen (wird bei TMDB geprüft, verschlüsselt gespeichert)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TMDBTokenInput"
      responses:
        "200":
          description: Benutzer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteTMDBToken
      tags: [Konto]
      summary: TMDB-Token entfernen
      security: [{ bearerAuth: [] }]
      responses:
