          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/admin/oidc/test:
    post:
      operationId: testOIDCSettings
      tags: [Admin]
      summary: Test the connection to the provider (reload discovery and keys)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Connection OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCCheck"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: SSO not set up (`validation`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Check failed (`oidcCheckFailed`, reason in `message`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/admin/oidc/password-login:
    put:
      operationId: setPasswordLogin
      tags: [Admin]
      summary: Switch password login on or off (off only with SSO set up and your own linked account)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginUpdate"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/admin/mail:
    get:
      operationId: getMailSettings
      tags: [Admin]
      summary: E-mail settings (admins only; the SMTP password is never returned)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: setMailSettings
      tags: [Admin]
      summary: Save the e-mail settings (encrypted). Without `password` the stored one is kept – unless server, port, encryption or user change.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailSettingsUpdate"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteMailSettings
      tags: [Admin]
      summary: Delete the e-mail settings (e-mail off)
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/mail/test:
    post:
      operationId: sendTestMail
      tags: [Admin]
      summary: Send a test e-mail with the stored settings
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestMail"
      responses:
        "204":
          description: Accepted by the mail server
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Invalid address (`validation`) or e-mail not set up (`mailNotConfigured`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/MailFailed"
  /v1/admin/notifications:
    get:
      operationId: getNotificationSettings
      tags: [Admin]
      summary: Time of the daily pass (server time zone) and the KNot webhook address (admins only)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNotificationSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: setNotificationSettings
      tags: [Admin]
      summary: Save the time of the daily pass and the webhook address (missing or empty `webhookUrl` turns the webhook off)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminNotificationSettingsUpdate"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNotificationSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
components:
  parameters:
    TmdbID:
      name: tmdbID
      in: path
      required: true
      schema:
        type: integer
    Season:
      name: season
      in: path
      required: true
      schema:
        type: integer
    Episode:
      name: number
      in: path
      required: true
      schema:
        type: integer
  responses:
    NotifyFailed:
      description: The notification could not be sent – mail server or webhook (`notifyFailed`, message with the reason)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MailFailed:
      description: The mail server rejected the message or was unreachable (`mailFailed`, message with the reason)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Admins only (`forbidden`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: "Invalid input (`validation`) or no TMDB token (`missingTMDBToken`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found (`notFound`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No token or an invalid one (`unauthorized`), or expired (`tokenExpired`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Device token (`ws_…`)
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code, e.g. `notFound`, `unauthorized`, `tokenExpired`.
        message:
          type: string
          description: German message, as shown in the web UI.
    NextEpisode:
      type: object
      required: [episodeId, season, number, name]
      properties:
        episodeId:
          type: string
          format: uuid
        season:
          type: integer
        number:
          type: integer
        name:
          type: string
        airDate:
          type: string
    WatchLink:
      type: object
      required: [label, url]
      properties:
        label:
          type: string
          description: e.g. “Auf Netflix suchen”, “Disney+ öffnen” (German, as in the web UI)
        url:
          type: string
    ContinueCard:
      type: object
      required: [tmdbId, name, next, remaining]
      properties:
        tmdbId:
          type: integer
        name:
          type: string
        posterPath:
          type: string
        rating:
          type: integer
        next:
          $ref: "#/components/schemas/NextEpisode"
        remaining:
          type: integer
        lastWatchedOn:
          type: string
        lastService:
          $ref: "#/components/schemas/Service"
        watchLink:
          $ref: "#/components/schemas/WatchLink"
    ContinueWatching:
      type: object
      required: [cards, olderCount]
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/ContinueCard"
        olderCount:
          type: integer
          description: Series paused for more than 3 months (included with `all=true`).
    NewEpisodesNote:
      type: object
      required: [tmdbId, name, count, first]
      properties:
        tmdbId:
          type: integer
        name:
          type: string
        posterPath:
          type: string
        count:
          type: integer
        first:
          $ref: "#/components/schemas/NextEpisode"
    UpcomingNote:
      type: object
      required: [tmdbId, name, count, next]
      properties:
        tmdbId:
          type: integer
        name:
          type: string
        count:
          type: integer
        next:
          $ref: "#/components/schemas/NextEpisode"
    Notes:
      type: object
      required: [newEpisodes, upcoming]
      properties:
        newEpisodes:
          type: array
          items:
            $ref: "#/components/schemas/NewEpisodesNote"
        upcoming:
          type: array
          items:
            $ref: "#/components/schemas/UpcomingNote"
    NextInput:
      type: object
      properties:
        episodeId:
          type: string
          format: uuid
          description: Episode the app showed as next (prevents double clicks).
    SearchResult:
      type: object
      required: [kind, tmdbId, name]
      properties:
        kind:
          type: string
          enum: [tv, movie]
        tmdbId:
          type: integer
        name:
          type: string
        year:
          type: integer
        posterPath:
          type: string
    SearchHit:
      type: object
      required: [kind, tmdbId, name, inLibrary]
      properties:
        kind:
          type: string
          enum: [tv, movie]
        tmdbId:
          type: integer
        name:
          type: string
        year:
          type: integer
        posterPath:
          type: string
        inLibrary:
          type: boolean
        watchedEpisodes:
          type: integer
        totalEpisodes:
          type: integer
        rating:
          type: integer
    MovieDetail:
      type: object
      required: [tmdbId, name, links, watches]
      properties:
        tmdbId:
          type: integer
        name:
          type: string
        year:
          type: integer
        posterPath:
          type: string
        overview:
          type: string
        runtime:
          type: integer
          description: Minutes
        genres:
          type: array
          description: Genres of the title; empty until loaded from TMDB (always sent; optional so apps also work with older servers)
          items:
            $ref: "#/components/schemas/Genre"
        links:
          $ref: "#/components/schemas/Links"
        rating:
          type: integer
        comment:
          type: string
        watches:
          type: array
          items:
            $ref: "#/components/schemas/WatchSummary"
    HistoryItem:
      type: object
      required: [id, kind, tmdbId, title, origin]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [tv, movie]
        tmdbId:
          type: integer
        title:
          type: string
        episode:
          $ref: "#/components/schemas/EpisodeRef"
        day:
          type: string
        service:
          $ref: "#/components/schemas/Service"
        origin:
          $ref: "#/components/schemas/WatchOrigin"
    EpisodeRef:
      type: object
      required: [season, number, name]
      properties:
        season:
          type: integer
        number:
          type: integer
        name:
          type: string
    HistoryPage:
      type: object
      required: [items, total, page, perPage]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HistoryItem"
        total:
          type: integer
        page:
          type: integer
        perPage:
          type: integer
    WatchEdit:
      type: object
      properties:
        day:
          type: string
          description: Day `yyyy-MM-dd`; if missing, the watch is undated afterwards.
        service:
          $ref: "#/components/schemas/Service"
    Genre:
      type: string
      description: >-
        Genre key; one list for series and movies (TMDB's mixed series genres are split, e.g. "Action & Adventure" →
        action + adventure). May grow in newer versions.
      enum: [action, adventure, animation, comedy, crime, documentary, drama, family, fantasy, history, horror, music, mystery, romance, science_fiction, tv_movie, thriller, war, western, kids, news, reality, soap, talk, politics]
    LibraryEntry:
      type: object
      required: [kind, tmdbId, name, hidden]
      properties:
        kind:
          type: string
          enum: [tv, movie]
        tmdbId:
          type: integer
        name:
          type: string
        posterPath:
          type: string
        rating:
          type: integer
        hidden:
          type: boolean
        genres:
          type: array
          description: Genres of the title; empty until loaded from TMDB (always sent; optional so apps also work with older servers)
          items:
            $ref: "#/components/schemas/Genre"
    LibraryRefresh:
      type: object
      required: [running, done, total, failed]
      properties:
        running:
          type: boolean
        done:
          type: integer
          description: Titles handled so far, successful or not
        total:
          type: integer
        failed:
          type: integer
        finishedAt:
          type: string
          format: date-time
          description: End of the last run; missing while running or before the first run
        error:
          type: string
          description: Why the last run stopped early (for example an invalid TMDB token)
    Period:
      type: object
      required: [movies, series, episodes, minutes, unknownRuntime]
      properties:
        movies:
          type: integer
        series:
          type: integer
        episodes:
          type: integer
        minutes:
          type: integer
        unknownRuntime:
          type: integer
          description: Watches without a known runtime (not counted in `minutes`).
    StatsMonth:
      type: object
      required: [month, stats]
      properties:
        month:
          type: integer
        stats:
          $ref: "#/components/schemas/Period"
    StatsYear:
      type: object
      required: [year, stats, months]
      properties:
        year:
          type: integer
        stats:
          $ref: "#/components/schemas/Period"
        months:
          type: array
          items:
            $ref: "#/components/schemas/StatsMonth"
    RatingBucket:
      type: object
      required: [movies, series, minutes]
      properties:
        rating:
          type: integer
          description: 10 … 1; missing = unrated
        movies:
          type: integer
        series:
          type: integer
        minutes:
          type: integer
    ChartBar:
      type: object
      description: One month of the selected year, or one year (when all years are shown).
      required: [label, seriesMinutes, movieMinutes, episodes, movies]
      properties:
        label:
          type: string
          description: '"Jan" … "Dec" or the year number'
        seriesMinutes:
          type: integer
        movieMinutes:
          type: integer
        episodes:
          type: integer
        movies:
          type: integer
    ServiceShare:
      type: object
      required: [minutes]
      properties:
        service:
          $ref: "#/components/schemas/Service"
        minutes:
          type: integer
          description: If `service` is missing, these are watches without a service.
        episodes:
          type: integer
          description: Episode watches on this service in the period.
        movies:
          type: integer
          description: Movie watches on this service in the period.
    MovieStat:
      type: object
      required: [tmdbId, name, watches, minutes]
      properties:
        tmdbId:
          type: integer
        name:
          type: string
        posterPath:
          type: string
        watches:
          type: integer
          description: Viewings in the period.
        minutes:
          type: integer
          description: Time of all these viewings; 0 when the runtime is unknown.
        rating:
          type: integer
    EpisodeStat:
      type: object
      required: [tmdbId, seriesName, season, number, name, watches]
      properties:
        tmdbId:
          type: integer
          description: TMDB id of the series.
        seriesName:
          type: string
        posterPath:
          type: string
        season:
          type: integer
        number:
          type: integer
        name:
          type: string
        watches:
          type: integer
    CompletedSeries:
      type: object
      required: [tmdbId, name, completions]
      properties:
        tmdbId:
          type: integer
        name:
          type: string
        posterPath:
          type: string
        completions:
          type: integer
          description: How often every aired regular episode (season ≥ 1, air date ≤ today) was watched.
        rating:
          type: integer
    GenreStat:
      type: object
      required: [genre, seriesMinutes, movieMinutes, series, movies]
      properties:
        genre:
          $ref: "#/components/schemas/Genre"
        seriesMinutes:
          type: integer
        movieMinutes:
          type: integer
        series:
          type: integer
          description: Distinct series with this genre watched in the period.
        movies:
          type: integer
          description: Distinct movies with this genre watched in the period.
    TopSeries:
      type: object
      required: [tmdbId, name, episodes, minutes]
      properties:
        tmdbId:
          type: integer
        name:
          type: string
        posterPath:
          type: string
        episodes:
          type: integer
        minutes:
          type: integer
        rating:
          type: integer
    Stats:
      type: object
      required: [period, chart, services, topSeries, total, undated, years, ratings, missingRuntimeTitles]
      properties:
        year:
          type: integer
          description: Selected year; missing = all years.
        period:
          $ref: "#/components/schemas/Period"
        previous:
          $ref: "#/components/schemas/Period"
        chart:
          type: array
          description: Months of the year (up to today), or one entry per year in ascending order; undated watches are not included here.
          items:
            $ref: "#/components/schemas/ChartBar"
        services:
          type: array
          description: Time per service, largest first.
          items:
            $ref: "#/components/schemas/ServiceShare"
        topSeries:
          type: array
          description: Up to 5 series by watch time.
          items:
            $ref: "#/components/schemas/TopSeries"
        longestMovies:
          type: array
          description: Up to 5 movies by the time of all their viewings (runtime known).
          items:
            $ref: "#/components/schemas/MovieStat"
        mostWatchedMovies:
          type: array
          description: Up to 5 movies watched at least twice, most viewings first.
          items:
            $ref: "#/components/schemas/MovieStat"
        mostWatchedEpisodes:
          type: array
          description: Up to 5 episodes watched at least twice, most viewings first.
          items:
            $ref: "#/components/schemas/EpisodeStat"
        mostCompletedSeries:
          type: array
          description: Up to 5 series watched completely at least once; always over all years, independent of `year`.
          items:
            $ref: "#/components/schemas/CompletedSeries"
        genres:
          type: array
          description: Time and titles per genre, largest first; a title counts for each of its genres.
          items:
            $ref: "#/components/schemas/GenreStat"
        total:
          $ref: "#/components/schemas/Period"
        undated:
          $ref: "#/components/schemas/Period"
        years:
          type: array
          items:
            $ref: "#/components/schemas/StatsYear"
        ratings:
          type: array
          items:
            $ref: "#/components/schemas/RatingBucket"
        missingRuntimeTitles:
          type: integer
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
    TMDBTokenInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: TMDB “API Read Access Token” (starts with `eyJ`).
    FollowedSeries:
      type: object
      required: [tmdbId, name]
      properties:
        tmdbId:
          type: integer
        name:
          type: string
        nextEpisode:
          $ref: "#/components/schemas/NextEpisode"
    ImportSummary:
      type: object
      required: [new, known, skipped]
      properties:
        new:
          type: integer
        known:
          type: integer
        skipped:
          type: integer
          description: Rows without a title
    ImportProgress:
      type: object
      required: [running, pendingRows, waitingForReview]
      properties:
        running:
          type: boolean
        pendingRows:
          type: integer
        waitingForReview:
          type: integer
        lastError:
          type: string
    MappingReview:
      type: object
      required: [id, netflixName, kind, rowCount, candidates]
      properties:
        id:
          type: string
          format: uuid
        netflixName:
          type: string
        kind:
          type: string
          enum: [tv, movie]
        rowCount:
          type: integer
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        firstDay:
          type: string
          description: Earliest day of the open rows (YYYY-MM-DD; always sent; optional so apps also work with older servers)
        lastDay:
          type: string
          description: Latest day of the open rows (YYYY-MM-DD)
        rows:
          type: array
          description: The open Netflix rows, newest first, at most 20
          items:
            $ref: "#/components/schemas/ReviewRow"
    ReviewRow:
      type: object
      required: [rawTitle, day]
      properties:
        rawTitle:
          type: string
        day:
          type: string
          description: YYYY-MM-DD
    UnmatchedRow:
      type: object
      required: [id, rawTitle, day, canAssign]
      properties:
        id:
          type: string
          format: uuid
        rawTitle:
          type: string
        day:
          type: string
        canAssign:
          type: boolean
          description: The series is known; the row can be assigned to an episode.
    TitleRef:
      type: object
      required: [tmdbId, name]
      properties:
        tmdbId:
          type: integer
        name:
          type: string
    Mapping:
      type: object
      required: [id, netflixName, kind, status]
      properties:
        id:
          type: string
          format: uuid
        netflixName:
          type: string
        kind:
          type: string
          enum: [tv, movie]
        status:
          $ref: "#/components/schemas/MappingStatus"
        title:
          $ref: "#/components/schemas/TitleRef"
    NetflixImport:
      type: object
      required: [progress, review, unmatched, unmatchedTotal, mappings]
      properties:
        progress:
          $ref: "#/components/schemas/ImportProgress"
        review:
          type: array
          items:
            $ref: "#/components/schemas/MappingReview"
        unmatched:
          type: array
          items:
            $ref: "#/components/schemas/UnmatchedRow"
        unmatchedTotal:
          type: integer
        mappings:
          type: array
          items:
            $ref: "#/components/schemas/Mapping"
    MappingDecision:
      type: object
      required: [kind, tmdbId]
      properties:
        kind:
          type: string
          enum: [tv, movie]
        tmdbId:
          type: integer
    EpisodeOption:
      type: object
      required: [episodeId, code, name]
      properties:
        episodeId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    RowAssignment:
      type: object
      required: [episodeId]
      properties:
        episodeId:
          type: string
          format: uuid
    FilmUploadResult:
      type: object
      required: [films]
      properties:
        films:
          type: integer
    FilmEntry:
      type: object
      required: [id, title, watchCount, status, candidates]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        year:
          type: integer
        watchCount:
          type: integer
        rating:
          type: integer
        status:
          $ref: "#/components/schemas/FilmStatus"
        tmdbId:
          type: integer
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        error:
          type: string
    FilmCounts:
      type: object
      required: [imported, review, notFound, skipped, pending]
      properties:
        imported:
          type: integer
        review:
          type: integer
        notFound:
          type: integer
        skipped:
          type: integer
        pending:
          type: integer
    FilmList:
      type: object
      required: [counts, entries]
      properties:
        counts:
          $ref: "#/components/schemas/FilmCounts"
        error:
          type: string
          description: Matching error (e.g. no TMDB token); entries stay open.
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FilmEntry"
    FilmAccept:
      type: object
      required: [tmdbId]
      properties:
        tmdbId:
          type: integer
    FilmSearch:
      type: object
      required: [q]
      properties:
        q:
          type: string
    UserSummary:
      type: object
      required: [id, username, isAdmin, hasTMDBToken, invitePending, ssoLinked]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        isAdmin:
          type: boolean
        hasTMDBToken:
          type: boolean
        createdAt:
          type: string
          format: date-time
        emailHint:
          type: string
          description: E-mail address, masked only, e.g. `p•••@example.org` (missing without a readable address)
        invitePending:
          type: boolean
          description: Account without a password whose invitation is still valid (always `false` for accounts linked to the OIDC provider)
        ssoLinked:
          type: boolean
          description: Linked to the configured OIDC provider
        inviteExpiresAt:
          type: string
          format: date-time
          description: Expiry of the open invitation
    OIDCSettings:
      type: object
      required: [configured, unreadable, hasClientSecret, passwordLogin, passwordLoginForced]
      properties:
        configured:
          type: boolean
        unreadable:
          type: boolean
          description: Stored, but not readable with the server key (SSO is then off)
        displayName:
          type: string
        issuer:
          type: string
        clientId:
          type: string
        hasClientSecret:
          type: boolean
        baseUrl:
          type: string
          description: Address of WatchSwifty
        redirectUrl:
          type: string
          description: Redirect URL for the provider (`baseUrl` + `/auth/oidc/callback`)
        passwordLogin:
          type: boolean
        passwordLoginForced:
          type: boolean
          description: Forced by `PASSWORD_LOGIN=true` (emergency switch)
        passwordLoginStored:
          type: boolean
          description: Stored switch (applies again once the emergency switch is removed); missing without SSO settings
        checkError:
          type: string
          description: Only after saving – why the connection check failed
    OIDCSettingsUpdate:
      type: object
      required: [issuer, clientId, baseUrl]
      properties:
        displayName:
          type: string
        issuer:
          type: string
        clientId:
          type: string
        clientSecret:
          type: string
          description: Empty or omitted = keep the stored one (not if the issuer or client ID changes)
        baseUrl:
          type: string
    OIDCCheck:
      type: object
      required: [issuer, keyCount]
      properties:
        issuer:
          type: string
        keyCount:
          type: integer
    PasswordLoginUpdate:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    SSOLinkResult:
      type: object
      required: [mailed]
      properties:
        mailed:
          type: boolean
          description: The link was e-mailed to the stored address
        emailHint:
          type: string
          description: Masked address the e-mail was sent (or should have been sent) to
        url:
          type: string
          description: The link to hand on, only if it was not e-mailed – never shown again
        mailError:
          type: string
          description: Why the e-mail was not sent
    CreatedUser:
      allOf:
        - $ref: "#/components/schemas/UserSummary"
        - type: object
          properties:
            inviteMailError:
              type: string
              description: Account created, but the invitation was not sent (reason); resend via POST /v1/admin/users/{id}/invite
    NewUser:
      type: object
      required: [username]
      description: With `password`, a regular account; without a password but with `email`, an invitation by e-mail (e-mail must be set up).
      properties:
        username:
          type: string
        password:
          type: string
          minLength: 8
        email:
          type: string
        isAdmin:
          type: boolean
    AdminPassword:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 8
    AdminFlag:
      type: object
      required: [isAdmin]
      properties:
        isAdmin:
          type: boolean
    UpdateCheck:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        checkedAt:
          type: string
          format: date-time
        latestVersion:
          type: string
        latestUrl:
          type: string
        error:
          type: string
        updateAvailable:
          type: boolean
          description: Missing for development builds (no comparison possible).
    System:
      type: object
      required: [version, updateCheck]
      properties:
        version:
          $ref: "#/components/schemas/Version"
        updateCheck:
          $ref: "#/components/schemas/UpdateCheck"
    UpdateCheckToggle:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    MailEncryption:
      type: string
      enum: [starttls, ssl, plain]
    MailSettings:
      type: object
      required: [configured, unreadable, hasPassword]
      properties:
        configured:
          type: boolean
        unreadable:
          type: boolean
          description: Stored, but not readable with the current TOKEN_KEY – enter it again.
        host:
          type: string
        port:
          type: integer
        encryption:
          $ref: "#/components/schemas/MailEncryption"
        username:
          type: string
        hasPassword:
          type: boolean
        fromAddress:
          type: string
        fromName:
          type: string
        caFile:
          type: string
        baseUrl:
          type: string
          description: Address of WatchSwifty used for links in e-mails
    MailSettingsUpdate:
      type: object
      required: [host, encryption, fromAddress, baseUrl]
      properties:
        host:
          type: string
        port:
          type: integer
        encryption:
          $ref: "#/components/schemas/MailEncryption"
        username:
          type: string
        password:
          type: string
        fromAddress:
          type: string
        fromName:
          type: string
        caFile:
          type: string
        baseUrl:
          type: string
    TestMail:
      type: object
      required: [to]
      properties:
        to:
          type: string
    Service:
      type: string
      enum: [netflix, prime_video, disney_plus, apple_tv, hbo_max, paramount_plus, wow, cinema, purchased, other]
    WatchOrigin:
      type: string
      description: Origin of a watch.
      enum: [manual, import]
    MappingStatus:
      type: string
      description: Status of a Netflix mapping.
      enum: [pending, auto, confirmed, review, ignored]
    FilmStatus:
      type: string
      description: Status of a movie list entry.
      enum: [pending, imported, review, not_found, skipped]
    NotifyChannel:
      type: string
      description: How notifications are sent.
      enum: [mail, webhook]
    NotificationPrefs:
      type: object
      required: [announced, soon, today, channel, availableChannels, webhookConfigured, hasWebhookKey, dailyRunTime]
      properties:
        announced:
          type: boolean
          description: Notify as soon as a new episode of a followed series is known.
        soon:
          type: boolean
          description: Notify 1–3 days before an episode airs.
        today:
          type: boolean
          description: Notify on the air date.
        channel:
          $ref: "#/components/schemas/NotifyChannel"
        activeChannel:
          $ref: "#/components/schemas/NotifyChannel"
        availableChannels:
          type: array
          items:
            $ref: "#/components/schemas/NotifyChannel"
          description: Channels set up for this account (mail needs mail settings and an own address, webhook the admin's address and an own key).
        webhookConfigured:
          type: boolean
          description: The admin set up a webhook address (only then a key can be used).
        hasWebhookKey:
          type: boolean
        dailyRunTime:
          type: string
          description: Time of the daily check, `HH:MM` in the server's time zone.
    NotificationPrefsUpdate:
      type: object
      required: [announced, soon, today, channel]
      properties:
        announced:
          type: boolean
        soon:
          type: boolean
        today:
          type: boolean
        channel:
          $ref: "#/components/schemas/NotifyChannel"
    WebhookKeyChange:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: KNot API key (at least 16 printable characters, no spaces); empty removes it.
        currentPassword:
          type: string
          deprecated: true
          description: Ignored; kept for older apps.
    WebhookKeyRemove:
      type: object
      properties:
        currentPassword:
          type: string
          deprecated: true
          description: Ignored; kept for older apps.
    AdminNotificationSettings:
      type: object
      required: [dailyRunTime, timeZone, nextRunAt]
      properties:
        dailyRunTime:
          type: string
          description: "`HH:MM`"
        timeZone:
          type: string
          description: The server's time zone (`TZ`), e.g. `Europe/Berlin`.
        webhookUrl:
          type: string
        lastRunAt:
          type: string
          format: date-time
        nextRunAt:
          type: string
          format: date-time
    AdminNotificationSettingsUpdate:
      type: object
      required: [dailyRunTime]
      properties:
        dailyRunTime:
          type: string
        webhookUrl:
          type: string
    DeviceKind:
      type: string
      description: Device token from the browser login or created by hand.
      enum: [device, manual]
    WatchInput:
      type: object
      properties:
        day:
          type: string
          description: Day `yyyy-MM-dd`; if missing, today applies. (Marking “up to here”, a season or a series is done without a date.)
        service:
          type: string
          enum: [netflix, prime_video, disney_plus, apple_tv, hbo_max, paramount_plus, wow, cinema, purchased, other, unknown]
          description: If missing, the most recently used service for this series applies; `unknown` = no service.
        rewatch:
          type: boolean
          description: >-
            Watched again (an additional watch instead of replacing). For a season or the whole series: a new round,
            every aired episode behind the highest watch count gets one more watch (all of them when they are level).
    HiddenInput:
      type: object
      required: [hidden]
      properties:
        hidden:
          type: boolean
    FollowInput:
      type: object
      required: [followed]
      properties:
        followed:
          type: boolean
    RatingInput:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 10
    CommentInput:
      type: object
      properties:
        comment:
          type: string
          maxLength: 2000
    Links:
      type: object
      required: [tmdb, imdb, rottenTomatoes]
      properties:
        tmdb:
          type: string
        imdb:
          type: string
        rottenTomatoes:
          type: string
        seriesGraph:
          type: string
    WatchSummary:
      type: object
      required: [id, origin]
      properties:
        id:
          type: string
          format: uuid
        day:
          type: string
        service:
          $ref: "#/components/schemas/Service"
        origin:
          $ref: "#/components/schemas/WatchOrigin"
    Episode:
      type: object
      required: [season, number, name, aired, watches]
      properties:
        season:
          type: integer
        number:
          type: integer
        name:
          type: string
        airDate:
          type: string
        overview:
          type: string
        runtime:
          type: integer
          description: Minutes
        aired:
          type: boolean
        watches:
          type: array
          items:
            $ref: "#/components/schemas/WatchSummary"
    Season:
      type: object
      required: [number, title, watchedCount, episodes]
      properties:
        number:
          type: integer
        title:
          type: string
        watchedCount:
          type: integer
        comment:
          type: string
        isOpen:
          type: boolean
          description: Season the web UI shows expanded (the one with the next episode, or the first without a watch).
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/Episode"
    SeriesDetail:
      type: object
      required: [tmdbId, name, links, hidden, followed, seasons]
      properties:
        tmdbId:
          type: integer
        name:
          type: string
        year:
          type: integer
        posterPath:
          type: string
        overview:
          type: string
        status:
          type: string
        runtime:
          type: integer
          description: Typical episode length in minutes
        genres:
          type: array
          description: Genres of the title; empty until loaded from TMDB (always sent; optional so apps also work with older servers)
          items:
            $ref: "#/components/schemas/Genre"
        links:
          $ref: "#/components/schemas/Links"
        rating:
          type: integer
        comment:
          type: string
        hidden:
          type: boolean
        followed:
          type: boolean
        lastService:
          $ref: "#/components/schemas/Service"
        next:
          $ref: "#/components/schemas/NextEpisode"
        seasons:
          type: array
          items:
            $ref: "#/components/schemas/Season"
    TokenRequest:
      type: object
      required: [code, codeVerifier, redirectUri]
      properties:
        code:
          type: string
        codeVerifier:
          type: string
        redirectUri:
          type: string
          description: Must be `dev.patmei.watchswifty:/auth`.
    TokenGrant:
      type: object
      required: [token, expiresAt, device, user]
      properties:
        token:
          type: string
          description: "Device token `ws_…` for the `Authorization: Bearer` header."
        expiresAt:
          type: string
          format: date-time
        device:
          $ref: "#/components/schemas/Device"
        user:
          $ref: "#/components/schemas/UserInfo"
    Device:
      type: object
      required: [id, name, kind, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/DeviceKind"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    UserInfo:
      type: object
      required: [username, isAdmin]
      properties:
        username:
          type: string
        isAdmin:
          type: boolean
    Me:
      type: object
      required: [username, isAdmin, hasPassword, tmdbToken, ssoLinked, passwordLogin]
      properties:
        username:
          type: string
        isAdmin:
          type: boolean
        hasPassword:
          type: boolean
          description: The account has a password; accounts created via SSO have none.
        ssoLinked:
          type: boolean
          description: The account is linked to the configured OIDC provider.
        passwordLogin:
          type: boolean
          description: The server allows password login (**Passwort ändern** (change password) only with `hasPassword` and `passwordLogin`).
        tmdbToken:
          $ref: "#/components/schemas/TMDBTokenState"
        email:
          type: string
          description: Own e-mail address (missing if none is stored or it is unreadable)
    EmailChange:
      type: object
      required: [email, currentPassword]
      properties:
        email:
          type: string
          description: Empty removes the address
        currentPassword:
          type: string
    TMDBTokenState:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [none, stored, unreadable]
        suffix:
          type: string
          description: Last four characters, e.g. `…abcd` (the token itself is never returned).
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
        commit:
          type: string
