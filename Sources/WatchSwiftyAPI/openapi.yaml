openapi: 3.1.0
info:
  title: WatchSwifty API
  version: 1.0.0
  description: |
    JSON-API für die WatchSwifty-App. Anmeldung über das Browser-Fenster (Authorization Code + PKCE),
    danach mit Geräte-Token im Header `Authorization: Bearer ws_…` (90 Tage gültig).
servers:
  - url: /api
tags:
  - name: Meta
  - name: Konto
  - name: Serien
paths:
  /v1/version:
    get:
      operationId: getVersion
      tags: [Meta]
      summary: Version des Servers
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /v1/auth/token:
    post:
      operationId: createToken
      tags: [Konto]
      summary: Einmal-Code aus dem Browser-Login gegen ein Geräte-Token tauschen
      description: |
        Ablauf: Die App öffnet `/api/auth/authorize?redirect_uri=watchswifty://auth&state=…&code_challenge=…&code_challenge_method=S256&device_name=…`
        im System-Browser-Fenster. Nach Anmeldung und „Verbinden“ springt der Browser zu `watchswifty://auth?code=…&state=…`.
        Den Code (60 s gültig, einmal einlösbar) hier mit dem PKCE-`codeVerifier` einlösen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Geräte-Token (wird nur hier einmal ausgegeben)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenGrant"
        "400":
          description: Code ungültig, abgelaufen oder Verifier falsch (`invalidGrant`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: revokeCurrentToken
      tags: [Konto]
      summary: Dieses Gerät abmelden
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Token widerrufen
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me:
    get:
      operationId: getMe
      tags: [Konto]
      summary: Angemeldeter Benutzer
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Benutzer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me/devices:
    get:
      operationId: listDevices
      tags: [Konto]
      summary: Geräte und manuell erstellte Tokens
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Geräte (ohne Token-Werte)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me/devices/{id}:
    delete:
      operationId: revokeDevice
      tags: [Konto]
      summary: Gerät abmelden
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Abgemeldet
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tv/{tmdbID}:
    get:
      operationId: getSeries
      tags: [Serien]
      summary: Serie mit Staffeln, Folgen und eigenen Sichtungen
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      responses:
        "200":
          description: Serie mit Staffeln und Folgen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/episodes/{season}/{number}/watch:
    post:
      operationId: markEpisode
      tags: [Serien]
      summary: Folge als gesehen markieren
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
        - $ref: "#/components/parameters/Season"
        - $ref: "#/components/parameters/Episode"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchInput"
      responses:
        "200":
          description: Serie mit Staffeln und Folgen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: unmarkEpisode
      tags: [Serien]
      summary: Folge als ungesehen markieren (alle Sichtungen)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
        - $ref: "#/components/parameters/Season"
        - $ref: "#/components/parameters/Episode"
      responses:
        "200":
          description: Serie mit Staffeln und Folgen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/episodes/{season}/{number}/watch-up-to:
    post:
      operationId: markUpTo
      tags: [Serien]
      summary: Alle Folgen bis hier gesehen (ohne Datum)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
        - $ref: "#/components/parameters/Season"
        - $ref: "#/components/parameters/Episode"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchInput"
      responses:
        "200":
          description: Serie mit Staffeln und Folgen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/seasons/{season}/watch:
    post:
      operationId: markSeason
      tags: [Serien]
      summary: Ganze Staffel gesehen (ohne Datum)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
        - $ref: "#/components/parameters/Season"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchInput"
      responses:
        "200":
          description: Serie mit Staffeln und Folgen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/watch-all:
    post:
      operationId: markSeries
      tags: [Serien]
      summary: Gesamte Serie gesehen (ohne Datum)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchInput"
      responses:
        "200":
          description: Serie mit Staffeln und Folgen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/hidden:
    put:
      operationId: setHidden
      tags: [Serien]
      summary: Serie aus- oder einblenden
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HiddenInput"
      responses:
        "200":
          description: Serie mit Staffeln und Folgen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/follow:
    put:
      operationId: setFollowed
      tags: [Serien]
      summary: Serie beobachten (Hinweis auf neue Folgen)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowInput"
      responses:
        "200":
          description: Serie mit Staffeln und Folgen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/rating:
    put:
      operationId: setSeriesRating
      tags: [Serien]
      summary: Bewertung 1–10 setzen; ohne `rating` löschen
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingInput"
      responses:
        "200":
          description: Serie mit Staffeln und Folgen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/comment:
    put:
      operationId: setSeriesComment
      tags: [Serien]
      summary: Kommentar zur Serie; ohne `comment` löschen
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "200":
          description: Serie mit Staffeln und Folgen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/seasons/{season}/comment:
    put:
      operationId: setSeasonComment
      tags: [Serien]
      summary: Kommentar zur Staffel
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
        - $ref: "#/components/parameters/Season"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "200":
          description: Serie mit Staffeln und Folgen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
components:
  parameters:
    TmdbID:
      name: tmdbID
      in: path
      required: true
      schema:
        type: integer
    Season:
      name: season
      in: path
      required: true
      schema:
        type: integer
    Episode:
      name: number
      in: path
      required: true
      schema:
        type: integer
  responses:
    Unprocessable:
      description: "Ungültige Eingabe (`validation`) oder kein TMDB-Token (`missingTMDBToken`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Nicht gefunden (`notFound`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Kein oder ungültiges Token (`unauthorized`) bzw. abgelaufen (`tokenExpired`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Geräte-Token (`ws_…`)
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Maschinenlesbarer Fehlercode, z. B. `notFound`, `unauthorized`, `tokenExpired`.
        message:
          type: string
          description: Deutsche Meldung wie in der Weboberfläche.
    Service:
      type: string
      enum: [netflix, prime_video, disney_plus, apple_tv, hbo_max, paramount_plus, wow, cinema, purchased, other]
    WatchInput:
      type: object
      properties:
        day:
          type: string
          description: Tag `yyyy-MM-dd`; fehlt er, wird ohne Datum gespeichert.
        service:
          type: string
          enum: [netflix, prime_video, disney_plus, apple_tv, hbo_max, paramount_plus, wow, cinema, purchased, other, unknown]
          description: Fehlt er, gilt der zuletzt genutzte Dienst dieser Serie; `unknown` = ohne Dienst.
        rewatch:
          type: boolean
          description: Erneut gesehen (zusätzliche Sichtung statt Ersetzen).
    HiddenInput:
      type: object
      required: [hidden]
      properties:
        hidden:
          type: boolean
    FollowInput:
      type: object
      required: [followed]
      properties:
        followed:
          type: boolean
    RatingInput:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 10
    CommentInput:
      type: object
      properties:
        comment:
          type: string
          maxLength: 2000
    Links:
      type: object
      required: [tmdb, imdb, rottenTomatoes]
      properties:
        tmdb:
          type: string
        imdb:
          type: string
        rottenTomatoes:
          type: string
        seriesGraph:
          type: string
    WatchSummary:
      type: object
      required: [id, origin]
      properties:
        id:
          type: string
          format: uuid
        day:
          type: string
        service:
          $ref: "#/components/schemas/Service"
        origin:
          type: string
          enum: [manual, import]
    Episode:
      type: object
      required: [season, number, name, aired, watches]
      properties:
        season:
          type: integer
        number:
          type: integer
        name:
          type: string
        airDate:
          type: string
        overview:
          type: string
        runtime:
          type: integer
          description: Minuten
        aired:
          type: boolean
        watches:
          type: array
          items:
            $ref: "#/components/schemas/WatchSummary"
    Season:
      type: object
      required: [number, title, watchedCount, episodes]
      properties:
        number:
          type: integer
        title:
          type: string
        watchedCount:
          type: integer
        comment:
          type: string
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/Episode"
    SeriesDetail:
      type: object
      required: [tmdbId, name, links, hidden, followed, seasons]
      properties:
        tmdbId:
          type: integer
        name:
          type: string
        year:
          type: integer
        posterPath:
          type: string
        overview:
          type: string
        status:
          type: string
        runtime:
          type: integer
          description: Typische Folgenlänge in Minuten
        links:
          $ref: "#/components/schemas/Links"
        rating:
          type: integer
        comment:
          type: string
        hidden:
          type: boolean
        followed:
          type: boolean
        lastService:
          $ref: "#/components/schemas/Service"
        seasons:
          type: array
          items:
            $ref: "#/components/schemas/Season"
    TokenRequest:
      type: object
      required: [code, codeVerifier, redirectUri]
      properties:
        code:
          type: string
        codeVerifier:
          type: string
        redirectUri:
          type: string
          description: Muss `watchswifty://auth` sein.
    TokenGrant:
      type: object
      required: [token, expiresAt, device, user]
      properties:
        token:
          type: string
          description: "Geräte-Token `ws_…` für den Header `Authorization: Bearer`."
        expiresAt:
          type: string
          format: date-time
        device:
          $ref: "#/components/schemas/Device"
        user:
          $ref: "#/components/schemas/UserInfo"
    Device:
      type: object
      required: [id, name, kind, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [device, manual]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    UserInfo:
      type: object
      required: [username, isAdmin]
      properties:
        username:
          type: string
        isAdmin:
          type: boolean
    Me:
      type: object
      required: [username, isAdmin, hasPassword, tmdbToken]
      properties:
        username:
          type: string
        isAdmin:
          type: boolean
        hasPassword:
          type: boolean
          description: Konto hat ein Passwort (ohne Authentik immer `true`).
        tmdbToken:
          $ref: "#/components/schemas/TMDBTokenState"
    TMDBTokenState:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [none, stored, unreadable]
        suffix:
          type: string
          description: Letzte vier Zeichen, z. B. `…abcd` (der Token selbst wird nie ausgegeben).
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
        commit:
          type: string
