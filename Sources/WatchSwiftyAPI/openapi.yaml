components:
  parameters:
    TmdbID:
      name: tmdbID
      in: path
      required: true
      schema:
        type: integer
    Season:
      name: season
      in: path
      required: true
      schema:
        type: integer
    Episode:
      name: number
      in: path
      required: true
      schema:
        type: integer
  responses:
    MailFailed:
      description: Der Mailserver hat nicht angenommen oder war nicht erreichbar (`mailFailed`, Meldung mit Ursache)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Nur für Admins (`forbidden`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: "Ungültige Eingabe (`validation`) oder kein TMDB-Token (`missingTMDBToken`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Nicht gefunden (`notFound`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Kein oder ungültiges Token (`unauthorized`) bzw. abgelaufen (`tokenExpired`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Geräte-Token (`ws_…`)
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Maschinenlesbarer Fehlercode, z. B. `notFound`, `unauthorized`, `tokenExpired`.
        message:
          type: string
          description: Deutsche Meldung wie in der Weboberfläche.
    NextEpisode:
      type: object
      required: [episodeId, season, number, name]
      properties:
        episodeId:
          type: string
          format: uuid
        season:
          type: integer
        number:
          type: integer
        name:
          type: string
        airDate:
          type: string
    WatchLink:
      type: object
      required: [label, url]
      properties:
        label:
          type: string
          description: z. B. „Auf Netflix suchen“, „Disney+ öffnen“
        url:
          type: string
    ContinueCard:
      type: object
      required: [tmdbId, name, next, remaining]
      properties:
        tmdbId:
          type: integer
        name:
          type: string
        posterPath:
          type: string
        rating:
          type: integer
        next:
          $ref: "#/components/schemas/NextEpisode"
        remaining:
          type: integer
        lastWatchedOn:
          type: string
        lastService:
          $ref: "#/components/schemas/Service"
        watchLink:
          $ref: "#/components/schemas/WatchLink"
    ContinueWatching:
      type: object
      required: [cards, olderCount]
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/ContinueCard"
        olderCount:
          type: integer
          description: Serien, die länger als 3 Monate pausieren (mit `all=true` enthalten).
    NewEpisodesNote:
      type: object
      required: [tmdbId, name, count, first]
      properties:
        tmdbId:
          type: integer
        name:
          type: string
        posterPath:
          type: string
        count:
          type: integer
        first:
          $ref: "#/components/schemas/NextEpisode"
    UpcomingNote:
      type: object
      required: [tmdbId, name, count, next]
      properties:
        tmdbId:
          type: integer
        name:
          type: string
        count:
          type: integer
        next:
          $ref: "#/components/schemas/NextEpisode"
    Notes:
      type: object
      required: [newEpisodes, upcoming]
      properties:
        newEpisodes:
          type: array
          items:
            $ref: "#/components/schemas/NewEpisodesNote"
        upcoming:
          type: array
          items:
            $ref: "#/components/schemas/UpcomingNote"
    NextInput:
      type: object
      properties:
        episodeId:
          type: string
          format: uuid
          description: Folge, die die App als nächste angezeigt hat (verhindert Doppelklicks).
    SearchResult:
      type: object
      required: [kind, tmdbId, name]
      properties:
        kind:
          type: string
          enum: [tv, movie]
