openapi: 3.1.0
info:
  title: WatchSwifty API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    JSON API for the WatchSwifty app. Sign-in happens in a browser window (Authorization Code + PKCE);
    afterwards, send the device token in the header `Authorization: Bearer ws_…` (valid for 90 days).
servers:
  - url: /api
tags:
  - name: Meta
  - name: Account
  - name: Home
  - name: Search
  - name: Series
  - name: Movies
  - name: History
  - name: Library
  - name: Statistics
  - name: Netflix import
  - name: Movie list
  - name: Admin
paths:
  /v1/version:
    get:
      operationId: getVersion
      tags: [Meta]
      summary: Server version
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /v1/auth/token:
    post:
      operationId: createToken
      tags: [Account]
      summary: Exchange the one-time code from the browser login for a device token
      description: |
        Flow: the app opens `/api/auth/authorize?redirect_uri=dev.patmei.watchswifty:/auth&state=…&code_challenge=…&code_challenge_method=S256&device_name=…`
        in the system browser window. After signing in and confirming with **Verbinden** (connect), the browser jumps to `dev.patmei.watchswifty:/auth?code=…&state=…`.
        Redeem the code (valid for 60 s, single use) here together with the PKCE `codeVerifier`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Device token (issued only once, here)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenGrant"
        "400":
          description: Code invalid, expired or verifier wrong (`invalidGrant`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: revokeCurrentToken
      tags: [Account]
      summary: Sign out this device
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Token revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me:
    get:
      operationId: getMe
      tags: [Account]
      summary: Signed-in user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me/devices:
    get:
      operationId: listDevices
      tags: [Account]
      summary: Devices and manually created tokens
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Devices (without token values)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me/devices/{id}:
    delete:
      operationId: revokeDevice
      tags: [Account]
      summary: Sign out a device
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Signed out
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tv/{tmdbID}:
    get:
      operationId: getSeries
      tags: [Series]
      summary: Series with seasons, episodes and own watches
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      responses:
        "200":
          description: Series with seasons and episodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/episodes/{season}/{number}/watch:
    post:
      operationId: markEpisode
      tags: [Series]
      summary: Mark an episode as watched
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
        - $ref: "#/components/parameters/Season"
        - $ref: "#/components/parameters/Episode"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchInput"
      responses:
        "200":
          description: Series with seasons and episodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: unmarkEpisode
      tags: [Series]
      summary: Mark an episode as unwatched (all watches)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
        - $ref: "#/components/parameters/Season"
        - $ref: "#/components/parameters/Episode"
      responses:
        "200":
          description: Series with seasons and episodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/episodes/{season}/{number}/watch-up-to:
    post:
      operationId: markUpTo
      tags: [Series]
      summary: Mark all episodes up to here as watched (no date)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
        - $ref: "#/components/parameters/Season"
        - $ref: "#/components/parameters/Episode"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchInput"
      responses:
        "200":
          description: Series with seasons and episodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/seasons/{season}/watch:
    post:
      operationId: markSeason
      tags: [Series]
      summary: Mark a whole season as watched (no date)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
        - $ref: "#/components/parameters/Season"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchInput"
      responses:
        "200":
          description: Series with seasons and episodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/watch-all:
    post:
      operationId: markSeries
      tags: [Series]
      summary: Mark a whole series as watched (no date)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchInput"
      responses:
        "200":
          description: Series with seasons and episodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/hidden:
    put:
      operationId: setHidden
      tags: [Series]
      summary: Hide or show a series
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HiddenInput"
      responses:
        "200":
          description: Series with seasons and episodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/follow:
    put:
      operationId: setFollowed
      tags: [Series]
      summary: Follow a series (notice about new episodes)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowInput"
      responses:
        "200":
          description: Series with seasons and episodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/rating:
    put:
      operationId: setSeriesRating
      tags: [Series]
      summary: Set a rating of 1–10; delete it if `rating` is omitted
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingInput"
      responses:
        "200":
          description: Series with seasons and episodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/comment:
    put:
      operationId: setSeriesComment
      tags: [Series]
      summary: Comment on the series; delete it if `comment` is omitted
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "200":
          description: Series with seasons and episodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/seasons/{season}/comment:
    put:
      operationId: setSeasonComment
      tags: [Series]
      summary: Comment on the season
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
        - $ref: "#/components/parameters/Season"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "200":
          description: Series with seasons and episodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/continue-watching:
    get:
      operationId: getContinueWatching
      tags: [Home]
      summary: "**Weiterschauen** (continue watching) – series of the last 3 months; all of them with `all=true`"
      security: [{ bearerAuth: [] }]
      parameters:
        - name: all
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinueWatching"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/notes:
    get:
      operationId: getNotes
      tags: [Home]
      summary: New episodes of followed series and episodes of the next 14 days
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Notices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notes"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/tv/{tmdbID}/next:
    post:
      operationId: markNextEpisode
      tags: [Home]
      summary: Mark the card's next episode as watched (today, most recently used service)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NextInput"
      responses:
        "200":
          description: Updated card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinueCard"
        "204":
          description: Series is caught up (no card any more)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tv/{tmdbID}/new-episodes/dismiss:
    post:
      operationId: dismissNewEpisodes
      tags: [Home]
      summary: Dismiss a “new episodes” notice
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      responses:
        "204":
          description: Done
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/search:
    get:
      operationId: search
      tags: [Search]
      summary: Search TMDB for series and films (at least 2 characters)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Results with the user's own status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchHit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/movies/{tmdbID}:
    get:
      operationId: getMovie
      tags: [Movies]
      summary: Film with own watches
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      responses:
        "200":
          description: Film with own watches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/movies/{tmdbID}/watch:
    post:
      operationId: markMovie
      tags: [Movies]
      summary: Mark a film as watched (watched again with `rewatch`)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchInput"
      responses:
        "200":
          description: Film with own watches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: unmarkMovie
      tags: [Movies]
      summary: Delete all watches of the film
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      responses:
        "200":
          description: Film with own watches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/movies/{tmdbID}/rating:
    put:
      operationId: setMovieRating
      tags: [Movies]
      summary: Rating of 1–10; delete it if `rating` is omitted
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingInput"
      responses:
        "200":
          description: Film with own watches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/movies/{tmdbID}/comment:
    put:
      operationId: setMovieComment
      tags: [Movies]
      summary: Comment on the film; delete it if `comment` is omitted
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TmdbID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "200":
          description: Film with own watches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/history:
    get:
      operationId: getHistory
      tags: [History]
      summary: Dated watches, newest first
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: perPage
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: One page of the history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/watches/{id}:
    put:
      operationId: updateWatch
      tags: [History]
      summary: Change the date and service of a watch (replaces both)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchEdit"
      responses:
        "200":
          description: Changed watch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteWatch
      tags: [History]
      summary: Delete a watch
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/library:
    get:
      operationId: getLibrary
      tags: [Library]
      summary: Watched, rated or hidden titles
      security: [{ bearerAuth: [] }]
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, tv, movie, hidden]
            default: all
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent, rating, name]
            default: recent
        - name: genre
          in: query
          description: Only titles with this genre
          schema:
            $ref: "#/components/schemas/Genre"
      responses:
        "200":
          description: Titles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/library/refresh:
    post:
      operationId: startLibraryRefresh
      tags: [Library]
      summary: Reload all of your titles from TMDB in the background
      description: >-
        Reloads every series and movie of the caller (watched, rated, hidden or followed) from TMDB with the caller's
        own TMDB token, one run per user at a time; while a run is going, its state is returned instead of starting a
        new one. Poll `GET /v1/library/refresh` for the progress. The progress is kept in memory only and is gone after
        a server restart.
      security: [{ bearerAuth: [] }]
      responses:
        "202":
          description: Run started (or already running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryRefresh"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    get:
      operationId: getLibraryRefresh
      tags: [Library]
      summary: Progress of the reload from TMDB
      description: Without a run since the server started, `running` is false, the counts are 0 and `finishedAt` is missing.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryRefresh"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/stats:
    get:
      operationId: getStats
      tags: [Statistics]
      summary: Films, series, episodes and time – period with chart, services, genres, longest and most watched titles, ratings
      description: >-
        `year` selects the period for `period`, `previous`, `chart`, `services`, `topSeries`, `longestMovies`,
        `mostWatchedMovies`, `mostWatchedEpisodes`, `genres` and `ratings`. `mostCompletedSeries`, `total`, `undated`
        and `years` always cover everything.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: year
          in: query
          description: Limit the period to one year (missing = all years).
          schema:
            type: integer
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me/password:
    put:
      operationId: changePassword
      tags: [Account]
      summary: Change the password (current password required)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Changed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Account without a password (`noPassword`) or password login switched off (`passwordLoginDisabled`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/me/email:
    put:
      operationId: setEmail
      tags: [Account]
      summary: Set your own e-mail address, or remove it with an empty value (current password required; stored encrypted)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChange"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Account without a password (`noPassword`) or the address comes from the OIDC provider (`emailFromProvider`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/me/tmdb-token:
    put:
      operationId: setTMDBToken
      tags: [Account]
      summary: Store your own TMDB token (verified with TMDB, stored encrypted)
      security: [{ bearerAuth: [] }]
      requestBody:
