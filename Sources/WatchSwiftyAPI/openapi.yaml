openapi: 3.1.0
info:
  title: WatchSwifty API
  version: 1.0.0
  description: |
    JSON-API für die WatchSwifty-App. Anmeldung über das Browser-Fenster (Authorization Code + PKCE),
    danach mit Geräte-Token im Header `Authorization: Bearer ws_…` (90 Tage gültig).
servers:
  - url: /api
tags:
  - name: Meta
  - name: Konto
paths:
  /v1/version:
    get:
      operationId: getVersion
      tags: [Meta]
      summary: Version des Servers
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /v1/me:
    get:
      operationId: getMe
      tags: [Konto]
      summary: Angemeldeter Benutzer
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Benutzer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  responses:
    Unauthorized:
      description: Kein oder ungültiges Token (`unauthorized`) bzw. abgelaufen (`tokenExpired`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Geräte-Token (`ws_…`)
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Maschinenlesbarer Fehlercode, z. B. `notFound`, `unauthorized`, `tokenExpired`.
        message:
          type: string
          description: Deutsche Meldung wie in der Weboberfläche.
    Me:
      type: object
      required: [username, isAdmin, hasPassword, tmdbToken]
      properties:
        username:
          type: string
        isAdmin:
          type: boolean
        hasPassword:
          type: boolean
          description: Konto hat ein Passwort (ohne Authentik immer `true`).
        tmdbToken:
          $ref: "#/components/schemas/TMDBTokenState"
    TMDBTokenState:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [none, stored, unreadable]
        suffix:
          type: string
          description: Letzte vier Zeichen, z. B. `…abcd` (der Token selbst wird nie ausgegeben).
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
        commit:
          type: string
